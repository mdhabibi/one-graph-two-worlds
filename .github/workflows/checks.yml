name: Book and lab checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  book-and-rdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-build.txt -r lab/requirements.txt
      - name: Validate committed release artifacts
        run: python scripts/check_package.py
      - name: Capture committed text and navigation
        run: python scripts/check_rebuild.py capture --out "$RUNNER_TEMP/kg-committed-document.json"
      - run: python scripts/build_pdf.py
      - run: python scripts/export_web.py
      - name: Compare rebuilt text and navigation
        run: python scripts/check_rebuild.py compare --baseline "$RUNNER_TEMP/kg-committed-document.json" --out "$RUNNER_TEMP/kg-rebuild-comparison.json"
      - run: python scripts/check_package.py
      - run: python lab/check_rdf.py
      - name: Check deliberate document, extension and metadata defects
        run: python scripts/verify_release_validation.py --out "$RUNNER_TEMP/kg-release-probes"
      - name: Check rebuild comparison controls
        run: python scripts/verify_rebuild.py --out "$RUNNER_TEMP/kg-rebuild-probes"
  cypher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Start disposable, unexposed exercise database
        run: >-
          docker run -d --name kg-book-lab --hostname localhost --memory=2g
          -e NEO4J_AUTH=none
          -e NEO4J_server_memory_heap_initial__size=256m
          -e NEO4J_server_memory_heap_max__size=512m
          -e NEO4J_server_memory_pagecache_size=128m
          neo4j:5.26.30
      - run: python lab/check_cypher.py --container kg-book-lab
      - if: always()
        run: docker rm -fv kg-book-lab
