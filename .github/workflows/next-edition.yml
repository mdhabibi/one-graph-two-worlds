name: Unpublished next-edition checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  draft:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next-edition
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-build.txt
      - name: Validate committed draft artifacts
        run: python scripts/validate_draft.py
      - name: Capture committed text and navigation
        run: python scripts/check_rebuild.py capture --out "$RUNNER_TEMP/kg-committed-document.json"
      - run: python scripts/build_pdf.py
      - run: python scripts/export_web.py
      - name: Compare rebuilt text and navigation with committed artifacts
        run: python scripts/check_rebuild.py compare --baseline "$RUNNER_TEMP/kg-committed-document.json" --out "$RUNNER_TEMP/kg-rebuild-comparison.json"
      - run: python scripts/validate_draft.py
      - name: Check deliberate document and extension defects
        run: python scripts/verify_draft_validation.py --out "$RUNNER_TEMP/kg-next-draft-probes"
      - name: Check rebuild comparison controls
        run: python scripts/verify_rebuild.py --out "$RUNNER_TEMP/kg-rebuild-probes"
