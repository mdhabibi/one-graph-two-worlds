<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="910" viewBox="0 0 1200 910" role="img" aria-labelledby="title desc"><title id="title">What changed: the name, meaning or rule?</title><desc id="desc">Version the affected artifacts; do not treat every change as an ontology change.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#52677b" stroke-width="1.5"/></marker></defs><rect width="1200" height="910" fill="#f4f7fb"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="40" y="48" font-size="31" fill="#142b47" font-weight="700">What changed: the name, meaning or rule?</text><text x="40" y="82" font-size="19" fill="#142b47" font-weight="400">Version the affected artifacts; do not treat every change as an ontology change.</text><rect x="40" y="115" width="1120" height="135" rx="12" fill="white" stroke="#00858c" stroke-width="2"/><g transform="translate(58 127) scale(1.0)" fill="none" stroke="#00858c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 6h17m-4-4 4 4-4 4M22 18H5m4-4-4 4 4 4"/></g><text x="94" y="148" font-size="21" fill="#00858c" font-weight="700">1  A field name changes</text><text x="60" y="181" font-size="19" fill="#142b47" font-weight="400">learner_id → student_key, with the same confirmed learner-identity scope.</text><text x="60" y="208" font-size="19" fill="#142b47" font-weight="400">Update the mapping; verify that learner, course and score facts stay the same.</text><rect x="40" y="280" width="1120" height="135" rx="12" fill="white" stroke="#7755aa" stroke-width="2"/><g transform="translate(58 292) scale(1.0)" fill="none" stroke="#7755aa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h10l10 10-10 10L2 13z"/><circle cx="7" cy="8" r="1.5"/></g><text x="94" y="313" font-size="21" fill="#7755aa" font-weight="700">2  The meaning changes</text><text x="60" y="346" font-size="19" fill="#142b47" font-weight="400">“Attended” is not “passed an assessment.” Preserve the source interpretation.</text><text x="60" y="373" font-size="19" fill="#142b47" font-weight="400">Review the domain model and affected mappings, shapes and policies; do not relabel history.</text><rect x="40" y="445" width="1120" height="98" rx="12" fill="white" stroke="#365acc" stroke-width="2"/><g transform="translate(58 457) scale(1.0)" fill="none" stroke="#365acc" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4H4v19h16V4h-4M8 2h8v5H8zM8 12h8M8 17h8"/></g><text x="94" y="478" font-size="21" fill="#365acc" font-weight="700">3  A decision rule changes; the observation does not</text><text x="60" y="511" font-size="19" fill="#142b47" font-weight="400">Separate assessment record, not completion event e1: score stays 65 percent.</text><rect x="40" y="585" width="520" height="150" rx="12" fill="white" stroke="#00858c" stroke-width="2"/><g transform="translate(58 597) scale(1.0)" fill="none" stroke="#00858c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4H4v19h16V4h-4M8 2h8v5H8zM8 12h8M8 17h8"/></g><text x="94" y="618" font-size="21" fill="#00858c" font-weight="700">Decision: 31 Oct 2026 → p60</text><text x="60" y="651" font-size="19" fill="#142b47" font-weight="400">Pass if score ≥ 60.</text><text x="60" y="678" font-size="19" fill="#142b47" font-weight="400">65 meets this policy → PASS</text><rect x="640" y="585" width="520" height="150" rx="12" fill="white" stroke="#b65b19" stroke-width="2"/><g transform="translate(658 597) scale(1.0)" fill="none" stroke="#b65b19" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4H4v19h16V4h-4M8 2h8v5H8zM8 12h8M8 17h8"/></g><text x="694" y="618" font-size="21" fill="#b65b19" font-weight="700">Decision: 1 Nov 2026 → p70</text><text x="660" y="651" font-size="19" fill="#142b47" font-weight="400">Pass if score ≥ 70.</text><text x="660" y="678" font-size="19" fill="#142b47" font-weight="400">65 does not meet this policy → FAIL</text><path d="M565,650 L630,650" fill="none" stroke="#52677b" stroke-width="3" /><polygon points="630.00,650.00 621.00,654.35 621.00,645.65" fill="#52677b"/><text x="40" y="777" font-size="19" fill="#142b47" font-weight="400">Policy is selected by decision time; p70 is effective from 1 November (inclusive).</text><text x="40" y="812" font-size="18" fill="#142b47" font-weight="400">Retain: source snapshot · mapping · ontology · shapes · policy · inference configuration.</text><text x="40" y="846" font-size="19" fill="#142b47" font-weight="400">This variation does not alter the baseline fact that Maya completed Graph Basics.</text></g></svg>