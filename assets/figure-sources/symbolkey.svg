<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="815" viewBox="0 0 1200 815" role="img" aria-labelledby="title desc"><title id="title">A consistent visual vocabulary</title><desc id="desc">Icons used as reading aids; older diagrams retain explicit text labels.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#52677b" stroke-width="1.5"/></marker></defs><rect width="1200" height="815" fill="#f4f7fb"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="40" y="48" font-size="31" fill="#142b47" font-weight="700">A consistent visual vocabulary</text><text x="40" y="82" font-size="19" fill="#142b47" font-weight="400">Icons used as reading aids; older diagrams retain explicit text labels.</text><rect x="40" y="125" width="550" height="98" rx="10" fill="white" stroke="#c7d2df"/><g transform="translate(55 149) scale(1.3333333333333333)" fill="none" stroke="#00858c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="6" r="4"/><path d="M4 23v-4a8 8 0 0 1 16 0v4"/></g><text x="106" y="161" font-size="21" fill="#142b47" font-weight="700">Maya: person instance</text><text x="106" y="193" font-size="18" fill="#142b47" font-weight="400">Not the class Person.</text><rect x="620" y="125" width="550" height="98" rx="10" fill="white" stroke="#c7d2df"/><g transform="translate(635 149) scale(1.3333333333333333)" fill="none" stroke="#00858c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="3" stroke-dasharray="3 2"/><path d="M7 16V8h10v8z"/></g><text x="686" y="161" font-size="21" fill="#142b47" font-weight="700">Person / Course: classes</text><text x="686" y="193" font-size="18" fill="#142b47" font-weight="400">Class icon; text identifies the class.</text><rect x="40" y="242" width="550" height="98" rx="10" fill="white" stroke="#c7d2df"/><g transform="translate(55 266) scale(1.3333333333333333)" fill="none" stroke="#00858c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5C7 1 2 3 2 3v17s5-2 10 2c5-4 10-2 10-2V3s-5-2-10 2zM12 5v17"/></g><text x="106" y="278" font-size="21" fill="#142b47" font-weight="700">Course instance</text><text x="106" y="310" font-size="18" fill="#142b47" font-weight="400">Keep c1 / c2 and the title.</text><rect x="620" y="242" width="550" height="98" rx="10" fill="white" stroke="#c7d2df"/><g transform="translate(635 266) scale(1.3333333333333333)" fill="none" stroke="#00858c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h10l10 10-10 10L2 13z"/><circle cx="7" cy="8" r="1.5"/></g><text x="686" y="278" font-size="21" fill="#142b47" font-weight="700">Topic</text><text x="686" y="310" font-size="18" fill="#142b47" font-weight="400">Keep graphs / data IDs.</text><rect x="40" y="359" width="550" height="98" rx="10" fill="white" stroke="#c7d2df"/><g transform="translate(55 383) scale(1.3333333333333333)" fill="none" stroke="#00858c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m6 12 4 4 8-9"/></g><text x="106" y="395" font-size="21" fill="#142b47" font-weight="700">Completion / pass status</text><text x="106" y="427" font-size="18" fill="#142b47" font-weight="400">An event still needs its own ID.</text><rect x="620" y="359" width="550" height="98" rx="10" fill="white" stroke="#c7d2df"/><g transform="translate(635 383) scale(1.3333333333333333)" fill="none" stroke="#00858c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 2h9l5 5v15H5zM14 2v6h5M8 12h8M8 16h8"/></g><text x="686" y="395" font-size="21" fill="#142b47" font-weight="700">Source evidence / input</text><text x="686" y="427" font-size="18" fill="#142b47" font-weight="400">Keep the document identifier.</text><rect x="40" y="476" width="550" height="98" rx="10" fill="white" stroke="#c7d2df"/><g transform="translate(55 500) scale(1.3333333333333333)" fill="none" stroke="#00858c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4H4v19h16V4h-4M8 2h8v5H8zM8 12h8M8 17h8"/></g><text x="106" y="512" font-size="21" fill="#142b47" font-weight="700">Policy / selected checks</text><text x="106" y="544" font-size="18" fill="#142b47" font-weight="400">Keep policy and shape versions.</text><rect x="620" y="476" width="550" height="98" rx="10" fill="white" stroke="#c7d2df"/><g transform="translate(635 500) scale(1.3333333333333333)" fill="none" stroke="#00858c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 11 20H1zM12 8v6"/><circle cx="12" cy="18" r=".6"/></g><text x="686" y="512" font-size="21" fill="#142b47" font-weight="700">Validation violation</text><text x="686" y="544" font-size="18" fill="#142b47" font-weight="400">Not automatic write rejection.</text><rect x="40" y="593" width="550" height="98" rx="10" fill="white" stroke="#c7d2df"/><g transform="translate(55 617) scale(1.3333333333333333)" fill="none" stroke="#00858c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12h20m-5-5 5 5-5 5" stroke-dasharray="4 3"/></g><text x="106" y="629" font-size="21" fill="#142b47" font-weight="700">Inferred consequence</text><text x="106" y="661" font-size="18" fill="#142b47" font-weight="400">Dashed arrow; read the stated rule.</text><text x="40" y="752" font-size="19" fill="#142b47" font-weight="400">Icons supplement labels; they do not assert types, facts or truth by themselves.</text></g></svg>