<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1140" viewBox="0 0 1200 1140" role="img" aria-labelledby="title desc"><title id="title">Which bindings survive each condition?</title><desc id="desc">Follow the baseline catalog through the same logical tests in SPARQL and Cypher.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#52677b" stroke-width="1.5"/></marker></defs><rect width="1200" height="1140" fill="#f4f7fb"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="40" y="48" font-size="31" fill="#142b47" font-weight="700">Which bindings survive each condition?</text><text x="40" y="82" font-size="19" fill="#142b47" font-weight="400">Follow the baseline catalog through the same logical tests in SPARQL and Cypher.</text><rect x="40" y="115" width="1120" height="103" rx="12" fill="white" stroke="#00858c" stroke-width="2"/><text x="60" y="148" font-size="23" fill="#00858c" font-weight="700">Relevant facts</text><text x="60" y="181" font-size="19" fill="#142b47" font-weight="400">Maya likes Graphs and completed c1. c2 requires c1. c1 and c2 are about Graphs.</text><rect x="40" y="240" width="1120" height="95" rx="12" fill="white" stroke="#7755aa" stroke-width="2"/><text x="60" y="273" font-size="23" fill="#7755aa" font-weight="700">Other catalog courses</text><text x="60" y="306" font-size="19" fill="#142b47" font-weight="400">c3 is about Data (requires c1); c4 is about Ethics. Neither binds Maya’s liked topic.</text><rect x="40" y="350" width="100" height="48" fill="#142b47"/><text x="55" y="382" font-size="21" fill="white" font-weight="700">Step</text><rect x="140" y="350" width="420" height="48" fill="#142b47"/><text x="155" y="382" font-size="21" fill="white" font-weight="700">Logical test</text><rect x="560" y="350" width="600" height="48" fill="#142b47"/><text x="575" y="382" font-size="21" fill="white" font-weight="700">Bindings / result</text><rect x="40" y="398" width="1120" height="108" fill="#ffffff"/><text x="65" y="436" font-size="25" fill="#00858c" font-weight="700">1</text><text x="155" y="436" font-size="20" fill="#142b47" font-weight="400">Anchor Person Maya; bind liked topic.</text><text x="575" y="433" font-size="20" fill="#142b47" font-weight="400">topic = graphs</text><rect x="40" y="506" width="1120" height="108" fill="#e8eef6"/><text x="65" y="544" font-size="25" fill="#00858c" font-weight="700">2</text><text x="155" y="544" font-size="20" fill="#142b47" font-weight="400">Match Course, topic, id and title.</text><text x="575" y="541" font-size="20" fill="#142b47" font-weight="400">c = c1; id=c1; title=Graph Basics</text><text x="575" y="571" font-size="20" fill="#142b47" font-weight="400">c = c2; id=c2; title=Graph Search</text><rect x="40" y="614" width="1120" height="108" fill="#ffffff"/><text x="65" y="652" font-size="25" fill="#00858c" font-weight="700">3</text><text x="155" y="652" font-size="20" fill="#142b47" font-weight="400">Exclude a recorded completion.</text><text x="575" y="649" font-size="20" fill="#142b47" font-weight="400">c1 removed: completed(c1) exists.</text><text x="575" y="679" font-size="20" fill="#142b47" font-weight="400">c2 remains: no completed(c2) witness.</text><rect x="40" y="722" width="1120" height="108" fill="#e8eef6"/><text x="65" y="760" font-size="25" fill="#00858c" font-weight="700">4</text><text x="155" y="760" font-size="20" fill="#142b47" font-weight="400">Exclude any unmet prerequisite.</text><text x="575" y="757" font-size="20" fill="#142b47" font-weight="400">For c2: required=c1; completed(c1) exists.</text><text x="575" y="787" font-size="20" fill="#142b47" font-weight="400">No unmet witness → keep c2.</text><rect x="40" y="855" width="1120" height="109" rx="12" fill="white" stroke="#00858c" stroke-width="2"/><text x="60" y="888" font-size="23" fill="#00858c" font-weight="700">Output pair: (c2, Graph Search)</text><text x="60" y="921" font-size="19" fill="#142b47" font-weight="400">Eligible under the recorded catalog policy; personal suitability is not assessed.</text><text x="40" y="1008" font-size="19" fill="#142b47" font-weight="400">SPARQL and Cypher use matching patterns and nested NOT EXISTS tests; see the full queries.</text><text x="40" y="1042" font-size="19" fill="#142b47" font-weight="400">This is a logical binding trace, not an engine plan. c3/c4 produce no shared-topic binding.</text><text x="40" y="1076" font-size="18" fill="#142b47" font-weight="400">Assumptions: aligned identities, inference, snapshots and sufficiently complete decision records.</text></g></svg>