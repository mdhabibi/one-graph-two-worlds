<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="895" viewBox="0 0 1200 895" role="img" aria-labelledby="title desc"><title id="title">Same input. Different questions.</title><desc id="desc">An inferred classification and a shape violation can coexist.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#52677b" stroke-width="1.5"/></marker></defs><rect width="1200" height="895" fill="#f4f7fb"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="40" y="48" font-size="31" fill="#142b47" font-weight="700">Same input. Different questions.</text><text x="40" y="82" font-size="19" fill="#142b47" font-weight="400">An inferred classification and a shape violation can coexist.</text><rect x="40" y="115" width="1120" height="135" rx="12" fill="white" stroke="#00858c" stroke-width="2"/><g transform="translate(58 127) scale(1.0)" fill="none" stroke="#00858c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 2h9l5 5v15H5zM14 2v6h5M8 12h8M8 16h8"/></g><text x="94" y="148" font-size="21" fill="#00858c" font-weight="700">Shared input: an isolated c2 variation</text><text x="60" y="181" font-size="19" fill="#142b47" font-weight="400">c2 is a Course; Course is a subclass of LearningResource.</text><text x="60" y="208" font-size="19" fill="#142b47" font-weight="400">Keep its baseline id, title and prerequisite; remove only c2’s durationMinutes.</text><path d="M410,250 L300,305" fill="none" stroke="#52677b" stroke-width="3" /><polygon points="300.00,305.00 306.11,297.08 310.00,304.86" fill="#52677b"/><path d="M790,250 L900,305" fill="none" stroke="#52677b" stroke-width="3" /><polygon points="900.00,305.00 890.00,304.86 893.89,297.08" fill="#52677b"/><rect x="40" y="320" width="545" height="198" rx="12" fill="white" stroke="#365acc" stroke-width="2"/><g transform="translate(58 332) scale(1.0)" fill="none" stroke="#365acc" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="3" stroke-dasharray="3 2"/><path d="M7 16V8h10v8z"/></g><text x="94" y="353" font-size="21" fill="#365acc" font-weight="700">Reasoning: what follows?</text><text x="60" y="386" font-size="19" fill="#142b47" font-weight="400">Apply RDFS subclass entailment.</text><text x="60" y="413" font-size="19" fill="#142b47" font-weight="400">Asserted: c2 → rdf:type → Course</text><text x="60" y="440" font-size="19" fill="#142b47" font-weight="400">Schema: Course → subClassOf → LearningResource</text><rect x="615" y="320" width="545" height="198" rx="12" fill="white" stroke="#7755aa" stroke-width="2"/><g transform="translate(633 332) scale(1.0)" fill="none" stroke="#7755aa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 4H4v19h16V4h-4M8 2h8v5H8zM8 12h8M8 17h8"/></g><text x="669" y="353" font-size="21" fill="#7755aa" font-weight="700">Validation: what must be present?</text><text x="635" y="386" font-size="19" fill="#142b47" font-weight="400">Use the supplied CourseShape on the input graph.</text><text x="635" y="413" font-size="19" fill="#142b47" font-weight="400">Target: Course; durationMinutes requires minCount 1.</text><text x="635" y="440" font-size="19" fill="#142b47" font-weight="400">Validate with inference=&quot;none&quot;.</text><path d="M305,520 L305,560" fill="none" stroke="#b65b19" stroke-width="3" stroke-dasharray="8 6"/><polygon points="305.00,560.00 300.65,551.00 309.35,551.00" fill="#b65b19"/><path d="M890,520 L890,560" fill="none" stroke="#52677b" stroke-width="3" /><polygon points="890.00,560.00 885.65,551.00 894.35,551.00" fill="#52677b"/><rect x="40" y="575" width="545" height="140" rx="12" fill="white" stroke="#b65b19" stroke-width="2"/><g transform="translate(58 587) scale(1.0)" fill="none" stroke="#b65b19" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12h20m-5-5 5 5-5 5" stroke-dasharray="4 3"/></g><text x="94" y="608" font-size="21" fill="#b65b19" font-weight="700">Entailed conclusion</text><text x="60" y="641" font-size="19" fill="#142b47" font-weight="400">c2 → rdf:type → LearningResource</text><text x="60" y="668" font-size="19" fill="#142b47" font-weight="400">The type follows even if it is not stored explicitly.</text><rect x="615" y="575" width="545" height="140" rx="12" fill="white" stroke="#7755aa" stroke-width="2"/><text x="635" y="608" font-size="23" fill="#7755aa" font-weight="700">Verified violation: missing duration</text><text x="635" y="641" font-size="19" fill="#142b47" font-weight="400">Focus: c2; path: durationMinutes</text><text x="635" y="668" font-size="19" fill="#142b47" font-weight="400">Component: MinCountConstraintComponent</text><text x="40" y="760" font-size="19" fill="#142b47" font-weight="400">Solid: supplied facts / processing. Dashed orange: an entailed consequence.</text><text x="40" y="794" font-size="18" fill="#142b47" font-weight="400">Parallel questions—not a reasoning-then-validation pipeline. Publishing/rejection is application policy.</text><text x="335" y="549" font-size="17" fill="#b65b19" font-weight="400">RDFS subclass entailment</text></g></svg>