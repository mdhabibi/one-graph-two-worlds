<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="655" viewBox="0 0 1200 655" role="img" aria-labelledby="title desc"><title id="title">Compare the source with its application projection</title><desc id="desc">A hybrid design needs explicit fact ownership, freshness and recovery rules.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#52677b" stroke-width="1.5"/></marker></defs><rect width="1200" height="655" fill="#f4f7fb"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="40" y="48" font-size="31" fill="#142b47" font-weight="700">Compare the source with its application projection</text><text x="40" y="82" font-size="19" fill="#142b47" font-weight="400">A hybrid design needs explicit fact ownership, freshness and recovery rules.</text><rect x="40" y="140" width="270" height="92" rx="12" fill="white" stroke="#365acc" stroke-width="2"/><text x="60" y="173" font-size="23" fill="#365acc" font-weight="700">Canonical RDF</text><text x="60" y="206" font-size="19" fill="#142b47" font-weight="400">authoritative facts</text><rect x="465" y="140" width="270" height="92" rx="12" fill="white" stroke="#b65b19" stroke-width="2"/><text x="485" y="173" font-size="23" fill="#b65b19" font-weight="700">Versioned mapping</text><text x="485" y="206" font-size="19" fill="#142b47" font-weight="400">projection pipeline</text><rect x="880" y="140" width="280" height="92" rx="12" fill="white" stroke="#365acc" stroke-width="2"/><text x="900" y="173" font-size="23" fill="#365acc" font-weight="700">Property graph</text><text x="900" y="206" font-size="19" fill="#142b47" font-weight="400">derived application view</text><path d="M310,186 L465,186" fill="none" stroke="#52677b" stroke-width="3" /><polygon points="465.00,186.00 456.00,190.35 456.00,181.65" fill="#52677b"/><path d="M735,186 L880,186" fill="none" stroke="#52677b" stroke-width="3" /><polygon points="880.00,186.00 871.00,190.35 871.00,181.65" fill="#52677b"/><path d="M175,234 L430,380" fill="none" stroke="#52677b" stroke-width="3" /><polygon points="430.00,380.00 420.02,379.30 424.35,371.75" fill="#52677b"/><path d="M1020,234 L770,380" fill="none" stroke="#52677b" stroke-width="3" /><polygon points="770.00,380.00 775.58,371.70 779.97,379.22" fill="#52677b"/><rect x="285" y="395" width="630" height="135" rx="12" fill="white" stroke="#7755aa" stroke-width="2"/><text x="305" y="428" font-size="23" fill="#7755aa" font-weight="700">Reconciliation compares both sides</text><text x="305" y="461" font-size="19" fill="#142b47" font-weight="400">Stable IDs · relationships · expected query answers</text><text x="305" y="488" font-size="19" fill="#142b47" font-weight="400">Include deletions, mapping version and snapshot lag.</text><text x="40" y="590" font-size="19" fill="#142b47" font-weight="400">Counts and hashes may help; they do not replace a declared semantic comparison contract.</text><text x="150" y="335" font-size="19" fill="#142b47">source snapshot</text><text x="870" y="340" font-size="19" fill="#142b47">projection snapshot</text></g></svg>