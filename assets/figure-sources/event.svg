<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="615" viewBox="0 0 1200 615" role="img" aria-labelledby="title desc"><title id="title">An event has its own identity and time</title><desc id="desc">Keep the learner, course, observation and supporting document distinct.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#52677b" stroke-width="1.5"/></marker></defs><rect width="1200" height="615" fill="#f4f7fb"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="40" y="48" font-size="31" fill="#142b47" font-weight="700">An event has its own identity and time</text><text x="40" y="82" font-size="19" fill="#142b47" font-weight="400">Keep the learner, course, observation and supporting document distinct.</text><rect x="40" y="140" width="250" height="92" rx="12" fill="white" stroke="#365acc" stroke-width="2"/><text x="60" y="173" font-size="23" fill="#365acc" font-weight="700">Maya</text><text x="60" y="206" font-size="19" fill="#142b47" font-weight="400">person instance</text><rect x="375" y="115" width="450" height="160" rx="12" fill="white" stroke="#b65b19" stroke-width="2"/><text x="395" y="148" font-size="23" fill="#b65b19" font-weight="700">Completion event e1</text><text x="395" y="181" font-size="19" fill="#142b47" font-weight="400">Course: c1 / Graph Basics</text><text x="395" y="208" font-size="19" fill="#142b47" font-weight="400">Score: 0.9 (zero-to-one scale)</text><text x="395" y="235" font-size="19" fill="#142b47" font-weight="400">Event time: 2026-10-01T09:00Z</text><rect x="910" y="140" width="250" height="92" rx="12" fill="white" stroke="#365acc" stroke-width="2"/><text x="930" y="173" font-size="23" fill="#365acc" font-weight="700">c1 / Graph Basics</text><text x="930" y="206" font-size="19" fill="#142b47" font-weight="400">course instance</text><path d="M375,190 L290,190" fill="none" stroke="#52677b" stroke-width="3" /><polygon points="290.00,190.00 299.00,185.65 299.00,194.35" fill="#52677b"/><path d="M825,190 L910,190" fill="none" stroke="#52677b" stroke-width="3" /><polygon points="910.00,190.00 901.00,194.35 901.00,185.65" fill="#52677b"/><path d="M600,275 L600,355" fill="none" stroke="#52677b" stroke-width="3" /><polygon points="600.00,355.00 595.65,346.00 604.35,346.00" fill="#52677b"/><text x="608.0" y="305.0" font-size="17" fill="#142b47" font-weight="400">evidence</text><rect x="375" y="370" width="450" height="110" rx="12" fill="white" stroke="#7755aa" stroke-width="2"/><text x="395" y="403" font-size="23" fill="#7755aa" font-weight="700">Supporting document d1</text><text x="395" y="436" font-size="19" fill="#142b47" font-weight="400">Document identity; not the event timestamp.</text><text x="40" y="550" font-size="19" fill="#142b47" font-weight="400">This invented completion event is separate from the 65-percent assessment-policy exercise.</text><text x="300" y="174" font-size="17" fill="#142b47">learner</text><text x="840" y="174" font-size="17" fill="#142b47">course</text></g></svg>