<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="835" viewBox="0 0 1200 835" role="img" aria-labelledby="title desc"><title id="title">Represent the same selected catalog facts</title><desc id="desc">RDF type assertions and LPG labels are shown explicitly, with the same title and topic link.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#52677b" stroke-width="1.5"/></marker></defs><rect width="1200" height="835" fill="#f4f7fb"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="40" y="48" font-size="31" fill="#142b47" font-weight="700">Represent the same selected catalog facts</text><text x="40" y="82" font-size="19" fill="#142b47" font-weight="400">RDF type assertions and LPG labels are shown explicitly, with the same title and topic link.</text><text x="40" y="126" font-size="24" fill="#00858c" font-weight="700">RDF: resources, class membership and literal value</text><rect x="40" y="220" width="285" height="92" rx="12" fill="white" stroke="#365acc" stroke-width="2"/><text x="60" y="253" font-size="23" fill="#365acc" font-weight="700">ex:c1</text><text x="60" y="286" font-size="19" fill="#142b47" font-weight="400">course resource</text><rect x="755" y="220" width="405" height="92" rx="12" fill="white" stroke="#7755aa" stroke-width="2"/><text x="775" y="253" font-size="23" fill="#7755aa" font-weight="700">ex:graphs</text><text x="775" y="286" font-size="19" fill="#142b47" font-weight="400">topic resource</text><path d="M325,266 L755,266" fill="none" stroke="#52677b" stroke-width="3" /><polygon points="755.00,266.00 746.00,270.35 746.00,261.65" fill="#52677b"/><text x="548.0" y="256.0" font-size="17" fill="#142b47" font-weight="400">ex:about</text><rect x="40" y="350" width="540" height="130" rx="12" fill="white" stroke="#7755aa" stroke-width="2"/><text x="60" y="383" font-size="23" fill="#7755aa" font-weight="700">Explicit class-membership triples</text><text x="60" y="416" font-size="19" fill="#142b47" font-weight="400">ex:c1 rdf:type ex:Course</text><text x="60" y="443" font-size="19" fill="#142b47" font-weight="400">ex:graphs rdf:type ex:Topic</text><rect x="620" y="350" width="540" height="130" rx="12" fill="white" stroke="#00858c" stroke-width="2"/><text x="640" y="383" font-size="23" fill="#00858c" font-weight="700">Title literal</text><text x="640" y="416" font-size="19" fill="#142b47" font-weight="400">ex:c1 ex:title &quot;Graph Basics&quot;</text><text x="640" y="443" font-size="19" fill="#142b47" font-weight="400">Untyped string syntax denotes xsd:string.</text><text x="40" y="535" font-size="24" fill="#00858c" font-weight="700">LPG: corresponding nodes, labels and properties</text><rect x="40" y="575" width="430" height="92" rx="12" fill="white" stroke="#365acc" stroke-width="2"/><text x="60" y="608" font-size="23" fill="#365acc" font-weight="700">c1 :Course</text><text x="60" y="641" font-size="19" fill="#142b47" font-weight="400">id: c1 | title: Graph Basics</text><rect x="755" y="575" width="405" height="92" rx="12" fill="white" stroke="#7755aa" stroke-width="2"/><text x="775" y="608" font-size="23" fill="#7755aa" font-weight="700">graphs :Topic</text><text x="775" y="641" font-size="19" fill="#142b47" font-weight="400">id: graphs</text><path d="M470,621 L755,621" fill="none" stroke="#52677b" stroke-width="3" /><polygon points="755.00,621.00 746.00,625.35 746.00,616.65" fill="#52677b"/><text x="620.5" y="611.0" font-size="17" fill="#142b47" font-weight="400">ABOUT</text><text x="40" y="730" font-size="20" fill="#142b47" font-weight="400">This chosen mapping aligns these facts; a label is not itself an RDF class resource.</text><text x="40" y="769" font-size="19" fill="#142b47" font-weight="400">Row headings are headings—not graph nodes. Names, IDs, types and edge directions matter.</text></g></svg>