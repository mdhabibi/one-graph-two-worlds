<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="645" viewBox="0 0 1200 645" role="img" aria-labelledby="title desc"><title id="title">Unresolved fact. Explicit decision policy.</title><desc id="desc">Name the missing relationship before applying an absence-based rule.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#52677b" stroke-width="1.5"/></marker></defs><rect width="1200" height="645" fill="#f4f7fb"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="40" y="48" font-size="31" fill="#142b47" font-weight="700">Unresolved fact. Explicit decision policy.</text><text x="40" y="82" font-size="19" fill="#142b47" font-weight="400">Name the missing relationship before applying an absence-based rule.</text><rect x="40" y="115" width="1120" height="115" rx="12" fill="white" stroke="#00858c" stroke-width="2"/><text x="60" y="148" font-size="23" fill="#00858c" font-weight="700">Isolated snapshot: prerequisite completion missing</text><text x="60" y="181" font-size="19" fill="#142b47" font-weight="400">Maya completed c1 is not recorded; neither that statement nor its negation is entailed.</text><text x="60" y="208" font-size="19" fill="#142b47" font-weight="400">We are assessing c2, whose recorded prerequisite is c1.</text><path d="M380,230 L300,285" fill="none" stroke="#52677b" stroke-width="3" /><polygon points="300.00,285.00 304.96,276.31 309.88,283.48" fill="#52677b"/><path d="M820,230 L900,285" fill="none" stroke="#52677b" stroke-width="3" /><polygon points="900.00,285.00 890.12,283.48 895.04,276.31" fill="#52677b"/><rect x="40" y="300" width="545" height="185" rx="12" fill="white" stroke="#365acc" stroke-width="2"/><text x="60" y="333" font-size="23" fill="#365acc" font-weight="700">Logical status: unresolved</text><text x="60" y="366" font-size="19" fill="#142b47" font-weight="400">Assume a consistent ontology.</text><text x="60" y="393" font-size="19" fill="#142b47" font-weight="400">No completion or non-completion conclusion follows.</text><text x="60" y="420" font-size="19" fill="#142b47" font-weight="400">Missing is not automatically false.</text><rect x="615" y="300" width="545" height="185" rx="12" fill="white" stroke="#b65b19" stroke-width="2"/><text x="635" y="333" font-size="23" fill="#b65b19" font-weight="700">Recorded-evidence policy</text><text x="635" y="366" font-size="19" fill="#142b47" font-weight="400">No recorded completion satisfies c1.</text><text x="635" y="393" font-size="19" fill="#142b47" font-weight="400">c2 fails the example’s eligibility gate.</text><text x="635" y="420" font-size="19" fill="#142b47" font-weight="400">This is an application-policy decision.</text><text x="40" y="540" font-size="20" fill="#142b47" font-weight="400">These are parallel questions. OWL does not itself produce the eligibility decision.</text><text x="40" y="579" font-size="19" fill="#142b47" font-weight="400">c2 must have no recorded completion to remain a candidate under this policy.</text></g></svg>