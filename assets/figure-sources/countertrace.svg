<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="905" viewBox="0 0 1200 905" role="img" aria-labelledby="title desc"><title id="title">Change one fact. Trace the changed answer.</title><desc id="desc">Inside the prerequisite test: a missing witness can change which course survives.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#52677b" stroke-width="1.5"/></marker></defs><rect width="1200" height="905" fill="#f4f7fb"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="40" y="48" font-size="31" fill="#142b47" font-weight="700">Change one fact. Trace the changed answer.</text><text x="40" y="82" font-size="19" fill="#142b47" font-weight="400">Inside the prerequisite test: a missing witness can change which course survives.</text><rect x="40" y="115" width="1120" height="105" rx="12" fill="white" stroke="#b65b19" stroke-width="2"/><text x="60" y="148" font-size="23" fill="#b65b19" font-weight="700">Change one recorded fact</text><text x="60" y="181" font-size="19" fill="#142b47" font-weight="400">Remove only Maya completed c1. All course and prerequisite facts remain unchanged.</text><rect x="40" y="250" width="540" height="180" rx="12" fill="white" stroke="#00858c" stroke-width="2"/><text x="60" y="283" font-size="23" fill="#00858c" font-weight="700">After the completion exclusion</text><text x="60" y="316" font-size="19" fill="#142b47" font-weight="400">c1 remains: no completion witness.</text><text x="60" y="343" font-size="19" fill="#142b47" font-weight="400">c2 remains: no completion witness.</text><text x="60" y="370" font-size="19" fill="#142b47" font-weight="400">Both still match Graphs.</text><rect x="620" y="250" width="540" height="180" rx="12" fill="white" stroke="#7755aa" stroke-width="2"/><text x="640" y="283" font-size="23" fill="#7755aa" font-weight="700">Now inspect prerequisites</text><text x="640" y="316" font-size="19" fill="#142b47" font-weight="400">c1: no recorded requires edge.</text><text x="640" y="343" font-size="19" fill="#142b47" font-weight="400">c2: requires c1; no completion of c1.</text><text x="640" y="370" font-size="19" fill="#142b47" font-weight="400">So c2 has an unmet witness.</text><rect x="40" y="465" width="540" height="152" rx="12" fill="white" stroke="#00858c" stroke-width="2"/><text x="60" y="498" font-size="23" fill="#00858c" font-weight="700">c1 survives by vacuous truth</text><text x="60" y="531" font-size="19" fill="#142b47" font-weight="400">No unmet prerequisite row exists.</text><text x="60" y="558" font-size="19" fill="#142b47" font-weight="400">The outer NOT EXISTS is true.</text><rect x="620" y="465" width="540" height="152" rx="12" fill="white" stroke="#b65b19" stroke-width="2"/><text x="640" y="498" font-size="23" fill="#b65b19" font-weight="700">c2 is excluded</text><text x="640" y="531" font-size="19" fill="#142b47" font-weight="400">An unmet prerequisite row exists.</text><text x="640" y="558" font-size="19" fill="#142b47" font-weight="400">The outer NOT EXISTS is false.</text><rect x="40" y="650" width="1120" height="108" rx="12" fill="white" stroke="#365acc" stroke-width="2"/><text x="60" y="683" font-size="23" fill="#365acc" font-weight="700">Changed output pair: (c1, Graph Basics)</text><text x="60" y="716" font-size="19" fill="#142b47" font-weight="400">The same query still applies. A different recorded snapshot gives a different answer.</text><text x="40" y="805" font-size="20" fill="#142b47" font-weight="400">No recorded prerequisite ≠ verified none required. State completeness policy for the decision.</text><text x="40" y="842" font-size="19" fill="#142b47" font-weight="400">This isolated variation changes no baseline fixture. Neither result establishes personal suitability.</text></g></svg>